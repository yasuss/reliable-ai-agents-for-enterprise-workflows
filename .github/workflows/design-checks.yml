name: Design checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  design-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run executable design checks
        run: python verification/design_checks.py
